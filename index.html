<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Қыз ұзату – Айша</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;

  background: url('https://images.unsplash.com/photo-1523438885200-e635ba2c371e') center/cover no-repeat;
  position: relative;
  color: white;
}

.hero::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.5);
}

.content {
  position: relative;
  animation: fadeIn 2s ease-in-out;
}

h1 {
  font-size: 55px;
  margin-bottom: 10px;
}

p {
  font-size: 20px;
  margin: 5px 0;
}

.date, .place {
  font-weight: bold;
}

.btn {
  display: inline-block;
  margin-top: 20px;
  padding: 12px 25px;
  background: #ff4d6d;
  color: white;
  text-decoration: none;
  border-radius: 30px;
  transition: 0.3s;
}

.btn:hover {
  background: #ff2d55;
  transform: scale(1.05);
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}
</style>

</head>

<body>

<div class="hero">
  <div class="content">
    <h1>Қыз ұзату – Аиша</h1>
    <p>Сіздерді қуанышымызға ортақ болуға шақырамыз</p>
    <p class="date">📅 20 июль 2026</p>
    <p class="place">📍 Алматы</p>

    <a class="btn" href="#">Я приду</a>
  </div>
</div>

</body>
</html>
