<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Қыз ұзату</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Montserrat',sans-serif;
  color:#fff;
  background:#000;
}

/* HERO (как у Tilda invite) */
.hero{
  height:100vh;
  background:url('https://images.unsplash.com/photo-1523438885200-e635ba2c371e') center/cover no-repeat;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.55);
}

.hero-content{
  position:relative;
}

h1{
  font-family:'Playfair Display',serif;
  font-size:70px;
  letter-spacing:1px;
}

.subtitle{
  margin-top:10px;
  font-size:18px;
  opacity:.9;
}

/* TIMER (как в инвайт сайтах) */
.timer{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:25px;
}

.timer div{
  background:rgba(255,255,255,0.12);
  padding:12px;
  border-radius:12px;
  min-width:70px;
  backdrop-filter:blur(10px);
}

.btn{
  display:inline-block;
  margin-top:25px;
  padding:12px 28px;
  background:#d4af37;
  color:black;
  border-radius:30px;
  text-decoration:none;
  font-weight:600;
}

/* SECTIONS (очень похоже на Tilda блоки) */
.section{
  padding:80px 20px;
  text-align:center;
  background:#0b0b0b;
}

.section h2{
  font-family:'Playfair Display',serif;
  font-size:40px;
  margin-bottom:20px;
}

.card{
  display:inline-block;
  background:rgba(255,255,255,0.06);
  padding:20px;
  border-radius:15px;
  backdrop-filter:blur(10px);
}

/* GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:20px;
}

.gallery img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:12px;
}

/* RSVP */
input{
  padding:10px;
  margin:5px;
  border-radius:10px;
  border:none;
  width:200px;
}

button{
  padding:12px 20px;
  background:#d4af37;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}

/* MOBILE */
@media(max-width:600px){
  h1{font-size:42px;}
  .gallery{grid-template-columns:1fr;}
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-content">
    <h1>Қыз ұзату</h1>
    <div class="subtitle">Сіздерді қуанышымызға шақырамыз</div>

    <div class="timer">
      <div><span id="d">0</span><br>күн</div>
      <div><span id="h">0</span><br>сағ</div>
      <div><span id="m">0</span><br>мин</div>
      <div><span id="s">0</span><br>сек</div>
    </div>

    <a class="btn" href="#info">Ашу</a>
  </div>
</div>

<!-- INFO -->
<div class="section" id="info">
  <h2>Мереке туралы</h2>
  <div class="card">
    📅 20 июль 2026<br>
    📍 Алматы<br>
    ⏰ 18:00
  </div>
</div>

<!-- STORY STYLE BLOCK -->
<div class="section">
  <h2>Шақыру</h2>
  <p style="opacity:.8; max-width:600px; margin:0 auto;">
    Сіздерді біздің өміріміздегі ең маңызды күннің куәсі болуға шақырамыз.
  </p>
</div>

<!-- GALLERY -->
<div class="section">
  <h2>Галерея</h2>
  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1523438885200-e635ba2c371e">
    <img src="https://images.unsplash.com/photo-1523438885200-e635ba2c371e">
  </div>
</div>

<!-- RSVP -->
<div class="section">
  <h2>RSVP</h2>
  <input placeholder="Атыңыз">
  <input placeholder="Қонақ саны">
  <br>
  <button onclick="alert('Рақмет 💛')">Қатысамын</button>
</div>

<script>
const date=new Date("July 20, 2026 18:00:00").getTime();

setInterval(()=>{
  let now=new Date().getTime();
  let diff=date-now;

  document.getElementById("d").innerText=Math.floor(diff/(1000*60*60*24));
  document.getElementById("h").innerText=Math.floor((diff/(1000*60*60))%24);
  document.getElementById("m").innerText=Math.floor((diff/(1000*60))%60);
  document.getElementById("s").innerText=Math.floor((diff/1000)%60);
},1000);
</script>

</body>
</html>
