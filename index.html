<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Қыз ұзату – Аиша</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Montserrat',sans-serif;
  background:#000;
  color:white;
  overflow-x:hidden;
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  background:url('https://images.unsplash.com/photo-1523438885200-e635ba2c371e') center/cover no-repeat;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.55);
}

.content{
  position:relative;
  z-index:2;
  animation:fadeUp 2s ease;
}

h1{
  font-family:'Playfair Display',serif;
  font-size:70px;
}

.subtitle{
  margin-top:10px;
  opacity:.9;
}

/* TIMER */
.timer{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:20px;
}

.timer div{
  background:rgba(255,255,255,0.12);
  padding:12px;
  border-radius:12px;
  min-width:70px;
  backdrop-filter:blur(10px);
}

/* BUTTONS */
.btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 28px;
  border-radius:30px;
  background:linear-gradient(45deg,#d4af37,#ffdd77);
  color:black;
  font-weight:600;
  text-decoration:none;
  cursor:pointer;
}

.small-btn{
  margin-top:10px;
  background:#222;
  color:white;
  padding:10px 15px;
  border-radius:10px;
  border:none;
  cursor:pointer;
}

/* SECTION */
.section{
  padding:80px 20px;
  text-align:center;
  background:#0b0b0b;
  opacity:0;
  transform:translateY(40px);
  transition:1s;
}

.section.show{
  opacity:1;
  transform:translateY(0);
}

h2{
  font-family:'Playfair Display',serif;
  font-size:40px;
  margin-bottom:15px;
}

/* CARD */
.card{
  display:inline-block;
  background:rgba(255,255,255,0.06);
  padding:20px;
  border-radius:15px;
  backdrop-filter:blur(10px);
}

/* MUSIC BUTTON */
.music{
  position:fixed;
  bottom:20px;
  right:20px;
  background:gold;
  color:black;
  padding:10px 15px;
  border-radius:20px;
  cursor:pointer;
  font-weight:600;
  z-index:10;
}

/* LEAVES */
.leaf{
  position:fixed;
  top:-10px;
  width:10px;
  height:10px;
  background:rgba(255,215,0,0.8);
  border-radius:50%;
  animation:fall linear infinite;
}

@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);}
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

/* MOBILE */
@media(max-width:600px){
  h1{font-size:42px;}
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="music" autoplay loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_3b3d5c9f5d.mp3">
</audio>

<div class="music" onclick="toggleMusic()">🎵 Music</div>

<!-- HERO -->
<div class="hero">
  <div class="content">
    <h1>Қыз ұзату – Аиша</h1>
    <div class="subtitle">Сіздерді қуанышымызға шақырамыз</div>

    <div class="timer">
      <div><span id="d">0</span><br>дней</div>
      <div><span id="h">0</span><br>час</div>
      <div><span id="m">0</span><br>мин</div>
      <div><span id="s">0</span><br>сек</div>
    </div>

    <a class="btn" href="#info">Открыть</a>
  </div>
</div>

<!-- INFO -->
<div class="section" id="info">
  <h2>Детали</h2>

  <div class="card">
    📅 20 июль 2026<br>
    📍 Алматы<br>
    ⏰ 18:00
  </div>

  <br><br>
  <button class="small-btn" onclick="copyText()">📋 Скопировать адрес</button>
</div>

<!-- RSVP -->
<div class="section">
  <h2>RSVP</h2>
  <div class="card">
    <input id="name" placeholder="Имя" style="padding:10px;border-radius:8px;border:none;margin:5px;">
    <input id="count" placeholder="Гостей" style="padding:10px;border-radius:8px;border:none;margin:5px;">
    <br>
    <button class="btn" onclick="sendTelegram()">Я приду</button>
  </div>
</div>

<script>

/* TIMER */
const date = new Date("July 20, 2026 18:00:00").getTime();

setInterval(()=>{
  let now = new Date().getTime();
  let diff = date - now;

  document.getElementById("d").innerText = Math.floor(diff/(1000*60*60*24));
  document.getElementById("h").innerText = Math.floor((diff/(1000*60*60))%24);
  document.getElementById("m").innerText = Math.floor((diff/(1000*60))%60);
  document.getElementById("s").innerText = Math.floor((diff/1000)%60);
},1000);

/* SCROLL */
const sections=document.querySelectorAll(".section");
window.addEventListener("scroll",()=>{
  sections.forEach(s=>{
    if(s.getBoundingClientRect().top < window.innerHeight-100){
      s.classList.add("show");
    }
  });
});

/* MUSIC */
function toggleMusic(){
  let m=document.getElementById("music");
  if(m.paused) m.play();
  else m.pause();
}

/* COPY */
function copyText(){
  navigator.clipboard.writeText("Алматы, банкет залы");
  alert("Скопировано 💛");
}

/* TELEGRAM RSVP */
function sendTelegram(){
  let name=document.getElementById("name").value;
  let count=document.getElementById("count").value;

  let text=`RSVP:%0AИмя: ${name}%0AГости: ${count}`;

  window.open("https://t.me/share/url?url=&text="+text,"_blank");
}

/* LEAVES */
function leaf(){
  let el=document.createElement("div");
  el.classList.add("leaf");
  el.style.left=Math.random()*100+"vw";
  el.style.animationDuration=3+Math.random()*5+"s";
  document.body.appendChild(el);

  setTimeout(()=>el.remove(),8000);
}
setInterval(leaf,200);

</script>

</body>
</html>
