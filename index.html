<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Қыз ұзату – Аиша</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Montserrat',sans-serif;
  background:#000;
  color:white;
  overflow-x:hidden;
}

/* HERO VIDEO BACKGROUND (premium effect) */
.hero{
  height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

.hero video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.55);
}

.hero-content{
  position:relative;
  animation:fadeUp 2s ease;
  z-index:2;
}

h1{
  font-family:'Playfair Display',serif;
  font-size:72px;
  letter-spacing:1px;
}

.subtitle{
  font-size:20px;
  margin-top:10px;
  opacity:.9;
}

/* GLASS TIMER */
.timer{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-top:25px;
}

.timer div{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  padding:15px;
  border-radius:16px;
  min-width:80px;
}

.timer span{
  font-size:22px;
  font-weight:600;
}

/* GOLD BUTTON */
.btn{
  display:inline-block;
  margin-top:25px;
  padding:14px 34px;
  background:linear-gradient(45deg,#d4af37,#ffdd77);
  color:black;
  border-radius:30px;
  font-weight:600;
  text-decoration:none;
  transition:.3s;
}

.btn:hover{
  transform:scale(1.05);
}

/* SECTIONS */
.section{
  padding:100px 20px;
  text-align:center;
  background:#0b0b0b;
  opacity:0;
  transform:translateY(50px);
  transition:1s;
}

.section.show{
  opacity:1;
  transform:translateY(0);
}

h2{
  font-family:'Playfair Display',serif;
  font-size:44px;
  margin-bottom:20px;
}

/* EVENT CARD */
.card{
  display:inline-block;
  background:rgba(255,255,255,0.06);
  padding:25px;
  border-radius:20px;
  margin-top:20px;
  backdrop-filter:blur(10px);
}

/* GALLERY GRID */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:12px;
  margin-top:20px;
}

.gallery img{
  width:100%;
  height:250px;
  object-fit:cover;
  border-radius:15px;
  transition:.3s;
}

.gallery img:hover{
  transform:scale(1.05);
}

/* RSVP */
input{
  padding:12px;
  margin:5px;
  border-radius:10px;
  border:none;
  width:200px;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:gold;
  font-weight:600;
  cursor:pointer;
}

/* FLOATING PARTICLES */
.particle{
  position:fixed;
  width:6px;
  height:6px;
  background:gold;
  border-radius:50%;
  opacity:.6;
  animation:float 6s linear infinite;
}

@keyframes float{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<!-- VIDEO BACKGROUND -->
<div class="hero">
  <video autoplay muted loop>
    <source src="https://cdn.coverr.co/videos/coverr-wedding-hands-clip-5219/1080p.mp4">
  </video>

  <div class="hero-content">
    <h1>Қыз ұзату – Аиша</h1>
    <div class="subtitle">Сіздерді ең ерекше күнімізге шақырамыз</div>

    <div class="timer">
      <div><span id="d">0</span><br>дней</div>
      <div><span id="h">0</span><br>час</div>
      <div><span id="m">0</span><br>мин</div>
      <div><span id="s">0</span><br>сек</div>
    </div>

    <a class="btn" href="#info">Открыть приглашение</a>
  </div>
</div>

<!-- INFO -->
<div class="section" id="info">
  <h2>Детали события</h2>

  <div class="card">
    📅 20 июль 2026<br>
    📍 Алматы<br>
    ⏰ 18:00
  </div>
</div>

<!-- GALLERY -->
<div class="section">
  <h2>Галерея</h2>

  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1523438885200-e635ba2c371e">
    <img src="https://images.unsplash.com/photo-1523438885200-e635ba2c371e">
    <img src="https://images.unsplash.com/photo-1523438885200-e635ba2c371e">
  </div>
</div>

<!-- RSVP -->
<div class="section">
  <h2>RSVP</h2>

  <input placeholder="Имя">
  <input placeholder="Гости">
  <br>
  <button onclick="alert('Вы добавлены 💛')">Я приду</button>
</div>

<script>

/* TIMER */
const date = new Date("July 20, 2026 18:00:00").getTime();

setInterval(()=>{
  let now = new Date().getTime();
  let diff = date - now;

  document.getElementById("d").innerText = Math.floor(diff/(1000*60*60*24));
  document.getElementById("h").innerText = Math.floor((diff/(1000*60*60))%24);
  document.getElementById("m").innerText = Math.floor((diff/(1000*60))%60);
  document.getElementById("s").innerText = Math.floor((diff/1000)%60);
},1000);

/* SCROLL ANIMATION */
const sections=document.querySelectorAll(".section");

window.addEventListener("scroll",()=>{
  sections.forEach(s=>{
    if(s.getBoundingClientRect().top < window.innerHeight-100){
      s.classList.add("show");
    }
  });
});

/* PARTICLES */
function createParticle(){
  const p=document.createElement("div");
  p.classList.add("particle");
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(3+Math.random()*5)+"s";
  document.body.appendChild(p);

  setTimeout(()=>p.remove(),8000);
}
setInterval(createParticle,200);

</script>

</body>
</html>
